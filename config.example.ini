# Exemple de configuration pour Affichage Prix Netfact
# Copiez ce fichier en config.ini à côté de l'exécutable et adaptez les valeurs.
# Normalement, ce fichier est généré automatiquement par l'assistant de
# première configuration au premier démarrage de l'application.
#
# ATTENTION : le mot de passe est normalement stocké sous forme obfusquée
# (préfixe « enc: ») par l'application. Vous pouvez saisir le mot de passe
# en clair ici ; l'application l'obfusquera automatiquement lors du premier
# enregistrement via l'assistant.

[firebird]
# Nom NetBIOS du serveur (ex : SERVEUR) ou son adresse IP (ex : 192.168.1.10)
host = SERVEUR

# Port TCP Firebird (3050 par défaut — à ouvrir dans le pare-feu Windows du serveur)
port = 3050

# Chemin complet du fichier base de données sur le SERVEUR
# (chemin local au serveur, pas au poste kiosque)
database = C:\Netfact\Data\PR22.FDB

# Utilisateur Firebird (SYSDBA par défaut)
user = SYSDBA

# Mot de passe Firebird (masterkey par défaut à l'installation)
# Peut être saisi en clair ici ; sera obfusqué par l'application.
password = masterkey

[woocommerce]
# Adresse complète du site WooCommerce (avec https://)
# Laisser vide pour désactiver les photos produits.
base_url = https://votresite.com

# Clé API WooCommerce en lecture seule
# (WooCommerce > Réglages > Avancé > REST API > Ajouter une clé)
consumer_key = ck_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# Secret API WooCommerce en lecture seule
consumer_secret = cs_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

[ui]
# Délai en secondes avant retour à l'écran de repos après un scan
idle_reset_seconds = 8

# Démarrer en mode plein écran (true/false)
fullscreen = true

# Raccourci clavier pour quitter l'application
exit_hotkey = Ctrl+Alt+Q
